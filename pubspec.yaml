name: ycd
description: "Flutter."
publish_to: 'none'
version: 1.0.0+1
#运行环境 sdk 3.29.2
environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  get: ^4.6.6
  dio: ^5.4.0
  http: ^1.1.0
  fluttertoast: ^8.2.12
  cupertino_icons: ^1.0.6
  syncfusion_flutter_charts: ^29.1.33
  fl_chart: ^0.70.0
  sqflite: ^2.4.2
  flutter_easyloading: ^3.0.5
  loading_animation_widget: ^1.2.1
  flutter_keyboard_visibility: ^6.0.0
  path_provider: ^2.1.3
  wakelock_plus: ^1.3.2
  flutter_screen_lock: ^9.2.2+2
  encrypt: ^5.0.3
  crypto: ^3.0.1
  shared_preferences: ^2.5.3
  #设备信息
  device_info_plus: ^9.1.2
  #程序信息
  package_info_plus: ^8.3.1
  #日志
  logger: ^2.6.1
  #lottie:
  lottie: ^3.3.1
  #屏幕适配
  flutter_screenutil: ^5.9.3
  #上拉下拉刷新
  easy_refresh: ^3.4.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  mongol: ^9.0.0

#dependency_overrides:
#  win32: ^3.0.0  # 选择一个兼容的版本（解决device_info_plus和package_info_plus不兼容）
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  #配置完之后要运行 dart run flutter_launcher_icons
  flutter_launcher_icons: ^0.14.4

flutter_icons:
  ios: true  # ios用时flutter中配置的图标
  android: true # Android用时flutter中配置的图标
  image_path: "assets/images/ww_logo.png"  # 图标路径

flutter:

  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg
  assets:
    - assets/images/
    - assets/loading_images/
    - assets/loading.json
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
